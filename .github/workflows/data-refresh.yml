name: Data Refresh

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Download source data
        run: make data-fetch

      - name: Build tables
        run: make data-build

      - name: Run tests
        id: tests
        continue-on-error: true
        run: make test

      - name: Run audit
        run: |
          {
            echo 'AUDIT_REPORT<<EOF'
            make audit 2>&1
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'data: refresh numbering-plan tables'
          title: 'data: monthly refresh of numbering-plan tables'
          body: |
            Automated monthly data refresh from NANPA, CNAC, and IFT sources.

            **Tests**: ${{ steps.tests.outcome }}
            > If tests failed, update the golden-file expected counts in `linetype_test.go` (TestGoldenListTxt).

            ## Audit Report
            ```
            ${{ env.AUDIT_REPORT }}
            ```

            Generated by the data-refresh workflow.
          branch: data-refresh/monthly
          delete-branch: true
          labels: data-refresh,automated
