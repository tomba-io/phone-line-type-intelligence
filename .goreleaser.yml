# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod download

builds:
  - id: lti
    main: ./cmd/lti
    binary: lti
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - ppc64
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: ppc64
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: ppc64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/tomba-io/phone-line-type-intelligence/internal/cli.version={{.Version}} -X github.com/tomba-io/phone-line-type-intelligence/internal/cli.commit={{.Commit}} -X github.com/tomba-io/phone-line-type-intelligence/internal/cli.date={{ .CommitDate }}

  - id: ltbuild
    main: ./cmd/ltbuild
    binary: ltbuild
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - ppc64
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: ppc64
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: ppc64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w

archives:
  - id: lti-archive
    ids: [lti]
    name_template: "lti_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: ltbuild-archive
    ids: [ltbuild]
    name_template: "ltbuild_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch
